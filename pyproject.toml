[project]
name = "football-ml"
version = "0.2.0"
description = "Pre-match football probabilities and value research"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
